[project]
name = "runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "droid-sdk>=0.5.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
